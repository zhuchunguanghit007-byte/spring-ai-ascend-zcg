# agent-store Docker Compose 部署配置（两容器版）
#
# 本编排仅启动 adapter-versatile + edp-agent。
# Versatile Mock、Redis、MCP Server 均由同事独立部署，在 .env 中填写可达地址。
#
# 用法（在 agent-store/deploy 目录）：
#   cp .env.example .env    # 填写 LLM 密钥、外部 Mock/Redis/MCP 地址
#   docker compose up -d
#
# 详细步骤见 DEPLOYMENT.md

services:
  adapter-versatile:
    image: adapter-versatile-agent-java:latest
    container_name: adapter-versatile
    build:
      context: ../adapter-versatile-agent-java
      dockerfile: deploy/Dockerfile
    ports:
      - "${ADAPTER_PORT:-8191}:8191"
    environment:
      VERSATILE_AGENT_PORT: "8191"
      VERSATILE_URL: "${VERSATILE_URL:?VERSATILE_URL is required — set to colleague Versatile Mock base URL}"
      VERSATILE_WORKFLOW_ID: "${VERSATILE_WORKFLOW_ID:-mock_workflow}"
      VERSATILE_WORKSPACE_ID: "${VERSATILE_WORKSPACE_ID:-10}"
      VERSATILE_RESULT_NODE_TYPE: "${VERSATILE_RESULT_NODE_TYPE:-QA}"
      VERSATILE_RESULT_NODE_NAME: "${VERSATILE_RESULT_NODE_NAME:-GXZQAResponseNode}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # adapter 镜像不带 curl，用 bash /dev/tcp 做端口探测
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8191"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 90s
    networks:
      - agent-store-net

  edp-agent:
    image: edp-agent-java:latest
    container_name: edp-agent
    build:
      context: ../edp-agent-java
      dockerfile: deploy/Dockerfile
    depends_on:
      adapter-versatile:
        condition: service_healthy
    ports:
      - "${EDP_AGENT_PORT:-8190}:8190"
    environment:
      SERVER_PORT: "8190"
      EDPA_AGENT_CONFIG_PATH: /app/config/edp-config.yaml
      EDP_AGENT_SCENARIO_HOME: /app/scenarios/wealth-demo
      EDPA_REDIS_HOST: "${EDPA_REDIS_HOST:?EDPA_REDIS_HOST is required — set to colleague Redis host/IP}"
      EDPA_REDIS_PORT: "${EDPA_REDIS_PORT:-6379}"
      EDPA_REDIS_PASSWORD: "${EDPA_REDIS_PASSWORD:-}"
      EDPA_REDIS_DB: "${EDPA_REDIS_DB:-0}"
      EDP_AGENT_MODEL_API_KEY: "${EDP_AGENT_MODEL_API_KEY:?EDP_AGENT_MODEL_API_KEY is required}"
      EDP_AGENT_MODEL_PROVIDER: "${EDP_AGENT_MODEL_PROVIDER:-OpenAI}"
      EDP_AGENT_MODEL_NAME: "${EDP_AGENT_MODEL_NAME:-deepseek-v4-pro}"
      EDP_AGENT_MODEL_BASE_URL: "${EDP_AGENT_MODEL_BASE_URL:-https://api.deepseek.com/v1}"
      EDP_AGENT_VERSATILE_A2A_URL: "${EDP_AGENT_VERSATILE_A2A_URL:-http://adapter-versatile:8191/a2a}"
      # 启动校验器要求合法 http URL，切勿留空；默认同机 Mock 用 host.docker.internal
      EDP_AGENT_VERSATILE_URL: "${EDP_AGENT_VERSATILE_URL:-http://host.docker.internal:30001/v1/0/agent-manager/workflows/{workflow_id}/conversations/{conversation_id}}"
      # MCP：application.yml 读取 EDP_MCP_*；兼容旧 .env 中的 MCP_* 写法
      EDP_MCP_MASTER_URL: "${EDP_MCP_MASTER_URL:-${MCP_MASTER_URL:-}}"
      EDP_MCP_STANDBY_URL: "${EDP_MCP_STANDBY_URL:-${MCP_STANDBY_URL:-}}"
      EDP_MCP_ACCESS_TOKEN: "${EDP_MCP_ACCESS_TOKEN:-${MCP_ACCESS_TOKEN:-}}"
      EDP_MCP_APP_NAME: "${EDP_MCP_APP_NAME:-${MCP_APP_NAME:-f-mlp}}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8190/.well-known/agent-card.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 90s
    networks:
      - agent-store-net

networks:
  agent-store-net:
    driver: bridge
